name: P0 baseline tag

on:
  push:
    branches:
      - modernize/p1-mcp-sdk-v2
    paths:
      - .github/workflows/p0-tag.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Create immutable P0 baseline tag
        env:
          TARGET_SHA: 0355c6508fb78da71eefdf7ccadb7030eac4ac80
        run: |
          TAG=v0.26.0-p0-frozen
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; leaving it unchanged"
            exit 0
          fi
          git cat-file -e "$TARGET_SHA^{commit}"
          git config user.name "clonetimer"
          git config user.email "115241403+clonetimer@users.noreply.github.com"
          git tag -a "$TAG" "$TARGET_SHA" -m "FreeSeek 0.26.0 P0 frozen cross-platform baseline"
          git push origin "refs/tags/$TAG"
